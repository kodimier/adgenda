services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adgenda
      POSTGRES_PASSWORD: adgenda
      POSTGRES_DB: adgenda
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adgenda -d adgenda"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
